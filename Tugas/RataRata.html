<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Rata-rata</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --background: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(to right, #6366f1, #4f46e5);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .input-readonly {
            background-color: rgba(16, 185, 129, 0.1) !important;
            border-color: rgba(16, 185, 129, 0.3) !important;
            color: #10b981 !important;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hitung Rata-rata Nilai</h1>
        <form id="averageForm">
            <div class="form-group">
                <label for="nilai1">Nilai Pertama</label>
                <input type="number" id="nilai1" required class="input-control">
            </div>
            <div class="form-group">
                <label for="nilai2">Nilai Kedua</label>
                <input type="number" id="nilai2" required class="input-control">
            </div>
            <div class="form-group">
                <label for="nilai3">Nilai Ketiga</label>
                <input type="number" id="nilai3" required class="input-control">
            </div>
            
            <button type="button" id="btnHasil" class="btn-submit">Hasil</button>

            <div class="form-group">
                <label for="hasil">Nilai Rata-rata</label>
                <input type="text" id="hasil" readonly class="input-control input-readonly" placeholder="Hasil rata-rata">
            </div>
        </form>
    </div>

    <script>
        document.getElementById('btnHasil').addEventListener('click', function(e) {
            e.preventDefault();
            const n1 = parseFloat(document.getElementById('nilai1').value) || 0;
            const n2 = parseFloat(document.getElementById('nilai2').value) || 0;
            const n3 = parseFloat(document.getElementById('nilai3').value) || 0;
            const average = (n1 + n2 + n3) / 3;
            document.getElementById('hasil').value = average.toFixed(2);
        });
    </script>
</body>
</html>
