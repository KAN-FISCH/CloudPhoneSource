<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login dengan Validasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --background: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(to right, #6366f1, #4f46e5);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            font-weight: 500;
            min-height: 20px;
            text-align: center;
        }

        .success-message {
            color: #10b981;
            font-size: 0.85rem;
            margin-top: 10px;
            font-weight: 500;
            min-height: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Login Akun</h1>
        <form id="loginForm" onsubmit="return validateForm(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="input-control" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-control" placeholder="Masukkan password">
            </div>
            
            <button type="submit" class="btn-submit">Login</button>
            <div id="feedback" class="error-message"></div>
        </form>
    </div>

    <script>
        function validateForm(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const feedback = document.getElementById('feedback');

            feedback.className = "error-message";
            feedback.innerText = "";

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (username === "") {
                feedback.innerText = "Username tidak boleh kosong!";
                usernameInput.focus();
                return false;
            }

            if (password === "") {
                feedback.innerText = "Password tidak boleh kosong!";
                passwordInput.focus();
                return false;
            }

            if (password.length < 6) {
                feedback.innerText = "Password minimal harus 6 karakter!";
                passwordInput.focus();
                return false;
            }

            feedback.className = "success-message";
            feedback.innerText = "Validasi berhasil! Memproses login...";
            
            setTimeout(() => {
                alert("Login Sukses!");
            }, 200);

            return true;
        }
    </script>
</body>
</html>
